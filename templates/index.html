<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Shield - Phishing Detection</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 550px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input[type="text"] { width: 85%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 15px; margin-bottom: 15px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 25px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; }
        .safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Web Shield Phishing Detector</h2>
        <form action="/predict" method="POST">
            <input type="text" name="url" placeholder="Paste URL here (e.g., https://example.com)..." required value="{{ url if url else '' }}">
            <br>
            <button type="submit">Analyze URL</button>
        </form>

        {% if prediction %}
            {% if prediction == 'Legitimate' %}
                <div class="result safe">
                    ✅ Safe Website! (Probability: {{ confidence }}%)
                </div>
            {% else %}
                <div class="result danger">
                    ⚠️ Warning: Phishing Suspected! (Probability: {{ confidence }}%)
                </div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
